[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosclaw-simpeople"
version = "0.2.0"
description = "Observable agent control of Isaac Sim Behavior humans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
test = ["pytest>=8", "jsonschema>=4"]
assets = ["usd-core>=25.11"]
video = ["av>=16,<17", "numpy>=1.24,<3"]

[project.scripts]
simpeople = "simpeople.tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
